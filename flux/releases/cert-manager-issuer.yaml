apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-issuer
  namespace: flux-system
spec:
  interval: 30m
  releaseName: cert-manager-issuer
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  dependsOn:
    - name: cert-manager
    - name: secrets-operator
  chart:
    spec:
      chart: ./chart/cert-manager-issuer
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
