apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-jev
  namespace: flux-system
spec:
  interval: 30m
  releaseName: simple-jev
  targetNamespace: simple-jev
  storageNamespace: simple-jev
  dependsOn:
    - name: traefik-proxy
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: ./chart/simple-jev
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
