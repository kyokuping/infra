apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-db
  namespace: flux-system
spec:
  interval: 30m
  releaseName: vaultwarden-db
  targetNamespace: vaultwarden
  storageNamespace: vaultwarden
  dependsOn:
    - name: cloudnative-pg
    - name: rook-ceph-cluster
    - name: secrets-operator
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./chart/vaultwarden-db
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
