apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-agent
  namespace: flux-system
spec:
  interval: 30m
  releaseName: otel-agent
  targetNamespace: otel-agent
  storageNamespace: otel-agent
  install:
    createNamespace: true
  dependsOn:
    - name: clickstack
    - name: secrets-operator
  chart:
    spec:
      chart: ./chart/otel-agent
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
