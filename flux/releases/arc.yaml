apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
  namespace: flux-system
spec:
  interval: 30m
  releaseName: arc
  targetNamespace: arc-systems
  storageNamespace: arc-systems
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: ./chart/gha-runner/gha-runner-scale-set-controller
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
