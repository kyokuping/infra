apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: clickhouse-operator
  targetNamespace: clickhouse-operator
  storageNamespace: clickhouse-operator
  install:
    createNamespace: true
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: ./chart/clickhouse-operator
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
