apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ente-photos
  namespace: flux-system
spec:
  interval: 30m
  releaseName: ente-photos
  targetNamespace: ente-photos
  storageNamespace: ente-photos
  dependsOn:
    - name: ente-photos-db
    - name: traefik-proxy
    - name: cert-manager-issuer
    - name: secrets-operator
  chart:
    spec:
      chart: ./chart/ente-photos
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
