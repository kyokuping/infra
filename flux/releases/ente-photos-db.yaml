apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ente-photos-db
  namespace: flux-system
spec:
  interval: 30m
  releaseName: ente-photos-db
  targetNamespace: ente-photos
  storageNamespace: ente-photos
  dependsOn:
    - name: cloudnative-pg
    - name: rook-ceph-cluster
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./chart/ente-photos-db
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
