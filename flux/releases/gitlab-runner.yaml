apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
  namespace: flux-system
spec:
  interval: 30m
  releaseName: gitlab-runner
  targetNamespace: gitlab-runner
  storageNamespace: gitlab-runner
  dependsOn:
    - name: secrets-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: ./chart/gitlab-runner
      reconcileStrategy: Revision
      interval: 5m
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
