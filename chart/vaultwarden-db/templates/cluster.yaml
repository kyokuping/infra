apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-db-v2
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: 1
  # Keep the Postgres major version aligned with the backup in R2 (PG 18).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9187"
  # One-time restore of the original cluster from the R2 (barman) archive.
  # Ignored once the cluster has been bootstrapped.
  bootstrap:
    recovery:
      source: vaultwarden-db
  externalClusters:
    - name: vaultwarden-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2
          serverName: vaultwarden-db
  # NOTE: temporary node-local storage. Move back to ceph-block once the
  # Ceph client/kernel key incompatibility is resolved.
  storage:
    storageClass: local-static
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2
