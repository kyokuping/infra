apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: vaultwarden-db-daily
spec:
  immediate: true
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: vaultwarden-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
