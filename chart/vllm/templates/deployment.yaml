apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: x86-worker
      containers:
        - name: vllm
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - {{ .Values.model }}
            - --served-model-name
            - {{ .Values.servedModelName }}
            - --safetensors-load-strategy
            - prefetch
            - --max-model-len
            - "4096"
            - --max-num-seqs
            - "1"
            - --gpu-memory-utilization
            - "0.88"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hfTokenSecretName }}
                  key: token
            - name: HF_HOME
              value: /models/huggingface
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
