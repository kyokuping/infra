traefik:
  providers:
    kubernetesCRD:
      allowExternalNameServices: true
  ports:
    tailnet:
      port: 9000
      expose:
        default: false
        simplejev: true
        vllm: true
      exposedPort: 80
  service:
    additionalServices:
      simplejev:
        type: LoadBalancer
        annotations:
          tailscale.com/hostname: simple-jev
        spec:
          loadBalancerClass: tailscale
          allocateLoadBalancerNodePorts: false
      vllm:
        type: LoadBalancer
        annotations:
          tailscale.com/hostname: vllm
        spec:
          loadBalancerClass: tailscale
          allocateLoadBalancerNodePorts: false
