rook-ceph-cluster:
  toolbox:
    enabled: true

  cephClusterMetadata:
    annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
      helm.sh/resource-policy: keep

  cephClusterSpec:
    continueUpgradeAfterChecksEvenIfNotHealthy: true

    mgr:
      count: 1
      modules:
        - name: prometheus
          enabled: true

    annotations:
      mgr:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9283"

    storage:
      useAllNodes: false
      useAllDevices: false
      allowDeviceClassUpdate: true
      nodes:
        - name: orangepi5-1
          devices:
            # OSD 0 lives on this USB disk. Kernel sdX names can change after
            # reboot, so use its stable udev path rather than /dev/sda.
            - name: /dev/disk/by-id/usb-JMicron_Tech_DD56419883892-0:0
        - name: mac-mini-orbstack
          devices:
            - name: sda
        - name: orangepi5-2
          devices:
            - name: sda
              config:
                deviceClass: bulk

    resources:
      mon:
        limits:
          memory: 1Gi
        requests:
          cpu: 250m
      mgr:
        requests:
          cpu: 250m
      osd:
        limits:
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 2Gi
      prepareosd:
        requests:
          cpu: 250m

    crashCollector:
      disable: true

    logCollector:
      enabled: false

    dashboard:
      ssl: false

  cephBlockPools:
    - name: ceph-blockpool
      spec:
        failureDomain: host
        enableCrushUpdates: true
        replicated:
          size: 3
        parameters:
          min_size: "2"
          pg_autoscale_mode: "off"
          pg_num: "32"
      storageClass:
        enabled: true
        name: ceph-block
        isDefault: true
        parameters: &rbdParameters
          imageFormat: "2"
          imageFeatures: layering
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/fstype: ext4

    - name: ceph-scratch
      spec:
        failureDomain: osd
        deviceClass: bulk
        replicated:
          size: 1
          requireSafeReplicaSize: false
        quotas:
          maxSize: "2T"
        parameters:
          min_size: "1"
          pg_autoscale_mode: "off"
          pg_num: "32"
      storageClass:
        enabled: true
        name: ceph-scratch
        parameters: *rbdParameters

  cephFileSystems:
    # One shared filesystem. Application data is split into static subvolumes.
    - name: home-fs
      spec:
        metadataPool:
          failureDomain: host
          replicated:
            size: 3
          parameters:
            min_size: "2"
            pg_autoscale_mode: "off"
            pg_num: "16"
        dataPools:
          - name: data0
            failureDomain: host
            replicated:
              size: 3
            parameters:
              min_size: "2"
              pg_autoscale_mode: "off"
              pg_num: "32"
        metadataServer:
          activeCount: 1
          activeStandby: true
          priorityClassName: system-cluster-critical
          placement:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [orangepi5-1, orangepi5-2]
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: rook_file_system
                        operator: In
                        values: [home-fs]
                  topologyKey: kubernetes.io/hostname
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
      storageClass:
        enabled: true
        isDefault: false
        name: ceph-filesystem
        pool: data0
        # Never let a PVC lifecycle delete family data.
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        parameters:
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"

  cephObjectStores: []
