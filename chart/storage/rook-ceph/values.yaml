rook-ceph:
  currentNamespaceOnly: true
  # Pin the CSI plugin to a build matching the Ceph cluster (20.2.4).
  # rook v1.20.6 ships cephcsi v3.17.0 (Ceph 20.2.1), whose cephx key parser
  # cannot read the 60-char keys generated by Ceph 20.2.4, which broke all
  # volume provisioning/mounting cluster-wide.
  csi:
    cephcsi:
      tag: v3.18.2
