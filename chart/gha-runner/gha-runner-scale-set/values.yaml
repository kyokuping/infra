system-playground:
  githubConfigSecret: ghr-github-token
  githubConfigUrl: "https://github.com/kyokuping/system-design-playground"
  runnerScaleSetName: manura

  minRunners: 0
  maxRunners: 3

  listenerTemplate:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"

  listenerMetrics:
    counters:
      gha_started_jobs_total:
        labels: [repository]
      gha_completed_jobs_total:
        labels: [repository, job_result]
    gauges:
      gha_assigned_jobs:
        labels: [name, namespace, repository]
      gha_running_jobs:
        labels: [name, namespace, repository]
      gha_registered_runners:
        labels: [name, namespace, repository]

  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: mac-mini-orbstack
