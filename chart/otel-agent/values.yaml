opentelemetry-collector:
  mode: daemonset

  image:
    repository: otel/opentelemetry-collector-k8s

  presets:
    logsCollection:
      enabled: true
    kubernetesAttributes:
      enabled: true

  # The vLLM worker is intentionally isolated with a dedicated taint. Run an
  # agent there as well so node-local discovery can scrape vLLM and Cilium.
  tolerations:
    - key: dedicated
      operator: Equal
      value: vllm
      effect: NoSchedule

  extraEnvs:
    - name: CLICKSTACK_INGESTION_KEY
      valueFrom:
        secretKeyRef:
          name: clickstack-ingestion-key
          key: token

  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            # Keep the collector's own telemetry, which is included by the
            # upstream chart's default Prometheus receiver configuration.
            - job_name: opentelemetry-collector
              scrape_interval: 30s
              static_configs:
                - targets:
                    - ${env:MY_POD_IP}:8888

            # Discover pods that opt in through the standard Prometheus
            # annotations. Limit each DaemonSet collector to its own node so
            # the same target is not scraped once per cluster node.
            - job_name: kubernetes-pods
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_pod_annotation_prometheus_io_scrape
                  action: keep
                  regex: "true"
                - source_labels:
                    - __meta_kubernetes_pod_node_name
                  action: keep
                  regex: ${env:K8S_NODE_NAME}
                - source_labels:
                    - __address__
                    - __meta_kubernetes_pod_annotation_prometheus_io_port
                  action: replace
                  regex: '([^:]+)(?::\d+)?;(\d+)'
                  replacement: '$1:$2'
                  target_label: __address__
                - source_labels:
                    - __meta_kubernetes_pod_annotation_prometheus_io_path
                  action: replace
                  regex: '(.+)'
                  target_label: __metrics_path__
                - source_labels:
                    - __meta_kubernetes_pod_annotation_prometheus_io_scheme
                  action: replace
                  regex: '(https?)'
                  target_label: __scheme__
                - source_labels:
                    - __meta_kubernetes_namespace
                  action: replace
                  target_label: k8s_namespace_name
                - source_labels:
                    - __meta_kubernetes_pod_name
                  action: replace
                  target_label: k8s_pod_name
                - source_labels:
                    - __meta_kubernetes_pod_label_app_kubernetes_io_component
                  action: replace
                  target_label: app_component

            # Hubble metrics share the Cilium agent pod but use a second port,
            # which cannot be represented by the single standard pod annotation.
            - job_name: cilium-hubble
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_pod_label_k8s_app
                  action: keep
                  regex: cilium
                - source_labels:
                    - __meta_kubernetes_pod_node_name
                  action: keep
                  regex: ${env:K8S_NODE_NAME}
                - source_labels:
                    - __address__
                  action: replace
                  regex: '([^:]+)(?::\d+)?'
                  replacement: '$1:9965'
                  target_label: __address__
                - source_labels:
                    - __meta_kubernetes_namespace
                  action: replace
                  target_label: k8s_namespace_name
                - source_labels:
                    - __meta_kubernetes_pod_name
                  action: replace
                  target_label: k8s_pod_name

            # Select operator-managed ClickHouse and Keeper pods by their named
            # Prometheus ports. Their ports differ (9363 and 9090), so retaining
            # the discovered target address is safer than a fixed annotation.
            - job_name: clickhouse
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_namespace
                  action: keep
                  regex: clickstack
                - source_labels:
                    - __meta_kubernetes_pod_container_port_name
                  action: keep
                  regex: prometheus
                - source_labels:
                    - __meta_kubernetes_pod_node_name
                  action: keep
                  regex: ${env:K8S_NODE_NAME}
                - source_labels:
                    - __meta_kubernetes_namespace
                  action: replace
                  target_label: k8s_namespace_name
                - source_labels:
                    - __meta_kubernetes_pod_name
                  action: replace
                  target_label: k8s_pod_name

            # CoreDNS exposes Prometheus metrics by default but the kubeadm
            # deployment does not carry scrape annotations.
            - job_name: coredns
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_namespace
                  action: keep
                  regex: kube-system
                - source_labels:
                    - __meta_kubernetes_pod_label_k8s_app
                  action: keep
                  regex: kube-dns
                - source_labels:
                    - __meta_kubernetes_pod_node_name
                  action: keep
                  regex: ${env:K8S_NODE_NAME}
                - source_labels:
                    - __address__
                  action: replace
                  regex: '([^:]+)(?::\d+)?'
                  replacement: '$1:9153'
                  target_label: __address__
                - source_labels:
                    - __meta_kubernetes_namespace
                  action: replace
                  target_label: k8s_namespace_name
                - source_labels:
                    - __meta_kubernetes_pod_name
                  action: replace
                  target_label: k8s_pod_name
    exporters:
      otlp_http/clickstack:
        endpoint: http://clickstack-otel-collector.clickstack.svc.cluster.local:4318
        headers:
          authorization: ${env:CLICKSTACK_INGESTION_KEY}
    service:
      pipelines:
        logs:
          exporters: [otlp_http/clickstack]
        metrics:
          receivers: [prometheus]
          processors: [k8s_attributes, memory_limiter, batch]
          exporters: [otlp_http/clickstack]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
