cilium:
  cluster:
    name: kubernetes

  prometheus:
    enabled: true

  envoy:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9964"

  hubble:
    metrics:
      enabled:
        - dns:query;ignoreAAAA
        - drop
        - tcp
        - icmp
    relay:
      enabled: true
      prometheus:
        enabled: true
    tls:
      auto:
        method: cronJob
    ui:
      enabled: true

  k8sServiceHost: 10.200.0.1
  k8sServicePort: 6443

  operator:
    replicas: 1

  routingMode: tunnel
  tunnelProtocol: vxlan
  upgradeCompatibility: "1.17"
