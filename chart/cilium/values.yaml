cilium:
  cluster:
    name: kubernetes

  # The node-local OTel agent scrapes these pod endpoints and forwards them to
  # ClickStack. ServiceMonitors stay disabled because this cluster does not run
  # Prometheus Operator.
  prometheus:
    enabled: true

  envoy:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9964"

  hubble:
    metrics:
      # HTTP metrics attach path/status labels and are disproportionately high
      # cardinality. These protocol/health signals cover the useful failure
      # modes without retaining request paths in ClickHouse.
      enabled:
        - dns:query;ignoreAAAA
        - drop
        - tcp
        - icmp
    relay:
      enabled: true
      prometheus:
        enabled: true
    tls:
      auto:
        method: cronJob
    ui:
      enabled: true

  k8sServiceHost: 10.200.0.1
  k8sServicePort: 6443

  operator:
    replicas: 1

  routingMode: tunnel
  tunnelProtocol: vxlan
  upgradeCompatibility: "1.17"
