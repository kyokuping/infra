cilium:
  cluster:
    name: kubernetes

  hubble:
    relay:
      enabled: true
    tls:
      auto:
        method: cronJob
    ui:
      enabled: true

  k8sServiceHost: 10.200.0.1
  k8sServicePort: 6443

  operator:
    replicas: 1

  routingMode: tunnel
  tunnelProtocol: vxlan
  upgradeCompatibility: "1.17"
