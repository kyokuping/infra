ente-photos:
  externalDatabase:
    host: ente-photos-db-rw.ente-photos.svc.cluster.local
    port: 5432
    database: ente
    user: ente
    existingSecret:
      enabled: true
      secretName: ente-photos-db-app
      passwordKey: password

  credentials:
    existingSecret: ente-photos-credentials

  museum:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "2112"
    image:
      repository: ghcr.io/ente/server
      tag: 163f45c26f130090abed03649530f53d2d976565
    config:
      db:
        sslmode: disable
      internal:
        disableRegistration: true
      s3:
        areLocalBuckets: false
        usePathStyleUrls: true
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    ingress:
      enabled: true
      className: traefik-proxy
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: photos-api.kyoku.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: ente-photos-api-tls
          hosts:
            - photos-api.kyoku.dev

  web:
    image:
      repository: ghcr.io/ente/web
      tag: latest@sha256:b59f681175405a769325ff542a6f4420e9cf8fbd5c538ea9812a75fcc004e056
    photos:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      ingress:
        enabled: true
        className: traefik-proxy
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: photos.kyoku.dev
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: ente-photos-web-tls
            hosts:
              - photos.kyoku.dev
      livenessProbe:
        enabled: true
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        enabled: true
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
    auth:
      enabled: false
    accounts:
      enabled: false
    albums:
      enabled: false
    share:
      enabled: false

  metrics:
    serviceMonitor:
      enabled: false

  networkPolicy:
    enabled: false
