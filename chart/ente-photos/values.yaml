ente-photos:
  externalDatabase:
    host: ente-photos-db-rw.ente-photos.svc.cluster.local
    port: 5432
    database: ente
    user: ente
    existingSecret:
      enabled: true
      secretName: ente-photos-db-app
      passwordKey: password

  credentials:
    existingSecret: ente-photos-credentials

  museum:
    image:
      repository: ghcr.io/ente/server
      tag: 163f45c26f130090abed03649530f53d2d976565
    config:
      db:
        sslmode: disable
      s3:
        areLocalBuckets: false
        usePathStyleUrls: true
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    ingress:
      enabled: true
      className: traefik-proxy
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: photos.kyoku.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: ente-photos-tls
          hosts:
            - photos.kyoku.dev

  web:
    photos:
      enabled: false
    auth:
      enabled: false
    accounts:
      enabled: false
    albums:
      enabled: false
    share:
      enabled: false

  metrics:
    serviceMonitor:
      enabled: false

  networkPolicy:
    enabled: false
