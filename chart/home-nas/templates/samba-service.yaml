apiVersion: v1
kind: Service
metadata:
  name: samba
  namespace: storage
  annotations: {tailscale.com/hostname: samba}
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector: {app: samba}
  ports: [{name: smb, port: 445, targetPort: smb, protocol: TCP}]
